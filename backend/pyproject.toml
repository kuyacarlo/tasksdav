[project]
name = "tasksdav"
version = "0.1.0"
description = "CalDAV façade over Google Tasks"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "authlib>=1.4",
  "itsdangerous>=2.2",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "bcrypt>=4.2",
  "icalendar>=6.0",
  "cryptography>=44.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[project.scripts]
tasksdav = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
