name: Keep Vercel warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health (no DB)
        run: |
          curl -fsS --max-time 30 "https://tasksdav.vercel.app/api/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
